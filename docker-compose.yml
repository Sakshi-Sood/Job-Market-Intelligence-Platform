# ================================================================
# docker-compose.yml
# Spins up three services:
#   db       — PostgreSQL 15
#   pipeline — runs ETL + NLP once, then exits
#   app      — Streamlit dashboard (stays running)
# ================================================================

version: "3.9"

services:

  # ── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: job_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"          # expose to host so pgAdmin still works
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist data across restarts
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # auto-run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ETL + NLP Pipeline ────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: job_analytics_pipeline
    depends_on:
      db:
        condition: service_healthy   
    environment:
      DB_NAME:       ${DB_NAME}
      DB_USER:       ${DB_USER}
      DB_PASSWORD:   ${DB_PASSWORD}
      DB_HOST:       db               
      DB_PORT:       5432
      RAPIDAPI_KEY:  ${RAPIDAPI_KEY}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST}
    volumes:
      - ./outputs:/app/outputs         
    # Run the full pipeline sequence: fetch → skills → NLP
    command: >
      sh -c "
        echo '[1/3] Running ETL pipeline...' &&
        python -m data_pipeline.fetch_jobs &&
        echo '[2/3] Running skill extraction...' &&
        python -m data_pipeline.skill_extractor &&
        echo '[3/3] Running NLP pipeline...' &&
        python -m data_pipeline.nlp_pipeline &&
        echo 'Pipeline complete.'
      "
    restart: "no"                      

  # ── Streamlit Dashboard ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: job_analytics_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME:       ${DB_NAME}
      DB_USER:       ${DB_USER}
      DB_PASSWORD:   ${DB_PASSWORD}
      DB_HOST:       db                
      DB_PORT:       5432
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs         
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local