# ================================================================
# .github/workflows/ci.yml
#
# CI Pipeline — runs on every push and pull request to main.
#
# Steps:
#   1. Lint (flake8)
#   2. Unit tests with coverage (pytest)
#   3. Build Docker image (verify it compiles cleanly)
# ================================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL for integration tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       test_db
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME:       test_db
      DB_USER:       test_user
      DB_PASSWORD:   test_password
      DB_HOST:       localhost
      DB_PORT:       5432
      RAPIDAPI_KEY:  dummy_key_for_tests
      RAPIDAPI_HOST: jsearch.p.rapidapi.com

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      # ── 4. Lint ────────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (don't fail the build)
          flake8 . --count --exit-zero --max-line-length=100 --statistics \
            --exclude=.git,__pycache__,venv,.venv

      # ── 5. Create DB schema ────────────────────────────────────
      - name: Initialise test database
        run: |
          pip install psycopg2-binary
          PGPASSWORD=test_password psql \
            -h localhost -U test_user -d test_db \
            -f database/schema.sql

      # ── 6. Run tests ───────────────────────────────────────────
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=data_pipeline \
            --cov=analytics \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        # Don't fail the whole CI if tests/ folder doesn't exist yet
        continue-on-error: true

      # ── 7. Upload coverage report ──────────────────────────────
      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  # ── Docker build verification ───────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test        # only build if lint+test passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false           # CI just verifies the build succeeds
          tags: job-analytics:ci-${{ github.sha }}
          cache-from: type=gha  # GitHub Actions cache for faster builds
          cache-to:   type=gha,mode=max